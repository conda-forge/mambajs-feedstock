context:
  name: mambajs
  version: "0.24.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/emscripten-forge/mambajs/archive/v${{ version }}.tar.gz
  sha256: c37ccabbc9ebb24e3187d47a40b0b3d1a7135c4382c9deec1c44e3f74f254f7d

build:
  number: 0

requirements:
  build:
    - yarn =3
    - nodejs
  host:
    - yarn =3
    - nodejs
  run:
    - nodejs

tests:
  - script:
      - mambajs --help
      - mambajs --version

about:
  homepage: https://github.com/emscripten-forge/mambajs
  repository: https://github.com/emscripten-forge/mambajs
  summary: 'Mambajs CLI for generating lock files'
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - martinRenou
