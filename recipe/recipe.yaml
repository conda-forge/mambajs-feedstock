context:
  name: mambajs
  version: "0.22.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/emscripten-forge/mambajs/archive/v${{ version }}.tar.gz
  sha256: 1aea3cb617afb46bfc1bf9ed93816d1def09679ae470510f4777b1576582cd4b

build:
  number: 0

requirements:
  build:
    - yarn =3
    - nodejs
  host:
    - yarn =3
    - nodejs
  run:
    - nodejs

tests:
  - script:
      - mambajs --help
      - mambajs --version

about:
  homepage: https://github.com/emscripten-forge/mambajs
  repository: https://github.com/emscripten-forge/mambajs
  summary: 'Mambajs CLI for generating lock files'
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - martinRenou
